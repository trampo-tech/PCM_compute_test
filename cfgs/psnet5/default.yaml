dataset:
  common:
    NAME: PSNet5Sphere
    data_root: ../ResPointNet2/data/PSNet/PSNet5
    split_manifest: analysis/psnet5/split.json
    partition_root: analysis/psnet5/results
    cache_dir: data/PSNet5/processed_pcm
    reference_ops_root: openpoints/cpp/subsampling
    protocol: development
    voxel_size: 0.04
    in_radius: 2.0
    num_points: 15000
    seed: 20260919
    height_mode: absolute
    verify_source_digest: true
  train:
    split: train
    num_steps: 2000
    num_epochs: 100
  val:
    split: val
    num_steps: 2000
    num_epochs: 1

feature_keys: x,heights
num_classes: 5
batch_size: 2
val_batch_size: 1

dataloader:
  num_workers: 6

datatransforms:
  train: [PointsToTensor, PointCloudScaling, PointCloudRotation, PointCloudJitter, ChromaticDropGPU, ChromaticNormalize]
  val: [PointsToTensor, ChromaticNormalize]
  vote: [ChromaticDropGPU]
  kwargs:
    color_drop: 0.2
    gravity_dim: 2
    scale: [0.9, 1.1]
    angle: [0, 0, 1]
    jitter_sigma: 0.005
    jitter_clip: 0.02

epochs: 100
val_freq: 1
# Development metrics are computed only on points reached by the fixed sphere
# schedule. Coverage is logged per area and must remain above this floor.
validation_require_full_coverage: false
validation_min_coverage: 0.90
cls_weighed_loss: false
criterion_args:
  NAME: MaskedCrossEntropy
  label_smoothing: 0.2

sched: cosine
warmup_epochs: 5
min_lr: 1.0e-5
lr: 0.0001
optimizer:
  NAME: adamw
  weight_decay: 0.05
grad_norm_clip: 10
use_voting: false
log_dir: psnet5
save_freq: -1

wandb:
  project: PCM-PSNet5
